[package]
name = "leptos-dashboard"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.93"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["RequestCredentials", "FormData", "Blob", "BlobPropertyBag", "HtmlInputElement", "File", "FileList", "Document", "Element", "EventTarget", "Event", "Navigator", "HtmlElement", "HtmlAnchorElement", "KeyboardEvent", "NodeList", "Window", "Url"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
cfg-if = "1"
