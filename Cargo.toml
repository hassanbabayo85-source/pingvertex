[workspace]
resolver = "2"

members = [
    "crates/domain",
    "crates/application",
    "crates/infra",
    "crates/api",
    "crates/worker",
    "crates/agent",
    "crates/shared",
    "apps/leptos-dashboard",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["ABUBAKAR HASSAN BABAYO"]
description = "PingVertex - Modern uptime monitoring platform."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
