services:
  postgres:
    image: postgres:16
    container_name: uptime-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uptime_monitor
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uptime_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: rust:1.89-slim
    container_name: uptime-monitor-migrate
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/uptime_monitor
    volumes:
      - .:/app
    command: >
      bash -c "
      export PATH=/usr/local/cargo/bin:/root/.cargo/bin:$PATH &&
      apt-get update &&
      apt-get install -y --no-install-recommends pkg-config libssl-dev ca-certificates &&
      cargo install sqlx-cli --no-default-features --features postgres &&
      sqlx database create || true &&
      sqlx migrate run --source migrations
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: uptime-monitor-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/uptime_monitor
      RUST_LOG: info
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: uptime-monitor-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/uptime_monitor
      RUST_LOG: info
    ports:
      - "3001:3001"


  prometheus:
    image: prom/prometheus:latest
    container_name: uptime-monitor-prometheus
    restart: unless-stopped
    depends_on:
      - api
      - worker
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: uptime-monitor-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3002:3000"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: uptime-monitor-alertmanager
    restart: unless-stopped

    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"

    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml

    ports:
      - "9093:9093"
