services:
  # ⚠️  DEVELOPMENT/LOCAL USE ONLY for the weak default passwords below.
  # Production MUST use docker-compose.prod.yml (which fails closed if
  # these are unset). Always deploy with:
  #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
  #
  # PART 3 (DB hardening): the postgres service now also receives the
  # three role passwords so the first-init bootstrap script can create
  # the `pingvertex_migrator` / `pingvertex_app` / `pingvertex_worker`
  # roles. The migrate / api / worker services each connect under their
  # own dedicated role — none of them uses the `postgres` superuser.
  postgres:
    image: postgres:16.6
    container_name: uptime-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: uptime_monitor
      # PART 3 — passed to docker/postgres-init/01-bootstrap-roles.sh
      # (runs once on first DB initialization).
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD must be set}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?POSTGRES_WORKER_PASSWORD must be set}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uptime_monitor"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4-alpine
    container_name: uptime-monitor-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

  # Migrations run as pingvertex_migrator — NOT superuser. The migrator
  # role owns the schema and may CREATE/ALTER/GRANT; it cannot create
  # roles or databases.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: uptime-monitor-migrate
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pingvertex_migrator:${POSTGRES_MIGRATOR_PASSWORD:?POSTGRES_MIGRATOR_PASSWORD must be set}@postgres:5432/uptime_monitor
    entrypoint: ["sh", "-c"]
    command:
      - "sqlx database create || true && sqlx migrate run --source migrations"

  # API runtime uses pingvertex_app — NOT superuser.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: uptime-monitor-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://pingvertex_app:${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}@postgres:5432/uptime_monitor
      RUST_LOG: info,axum::rejection=trace,tower_http=debug
    ports:
      - "127.0.0.1:3000:3000"
      - "3443:3443"

  # Background worker uses pingvertex_worker — NOT superuser.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: uptime-monitor-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://pingvertex_worker:${POSTGRES_WORKER_PASSWORD:?POSTGRES_WORKER_PASSWORD must be set}@postgres:5432/uptime_monitor
      RUST_LOG: info
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN must be set for worker metrics}
    ports:
      - "127.0.0.1:3001:3001"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: uptime-monitor-prometheus
    restart: unless-stopped
    depends_on:
      - api
      - worker
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules.yml:/etc/prometheus/rules.yml
    secrets:
      - metrics_token
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: uptime-monitor-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set}
    ports:
      - "127.0.0.1:3002:3000"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: uptime-monitor-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    ports:
      - "127.0.0.1:9093:9093"

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: uptime-monitor-agent
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      AGENT_API_BASE_URL: https://api:3443/internal/v1
      AGENT_ID: agent-us-east-1
      RUST_LOG: info

  frontend-build:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: uptime-monitor-frontend-build
    working_dir: /app/apps/leptos-dashboard
    environment:
      CARGO_TARGET_DIR: /tmp/target
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_REDIRECT_URI: ${APPLE_REDIRECT_URI:-}
    volumes:
      - .:/app
      - frontend_dist:/app/apps/leptos-dashboard/dist
    command: trunk build --release
    restart: "no"

volumes:
  postgres_data:
  frontend_dist:
  redis_data:

secrets:
  metrics_token:
    file: .metrics_token
