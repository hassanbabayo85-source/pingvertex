name: Feature request
description: Suggest a capability PingVertex does not have yet
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution. This is the part maintainers weigh most.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Monitoring / checks
        - Incidents & notifications
        - Status pages
        - Real User Monitoring
        - Dashboard / UX
        - API & integrations
        - Billing / plans
        - Deployment & operations
        - Other
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Would you be willing to work on this?
      options:
        - label: I would like to implement it myself
        - label: I can help test it
