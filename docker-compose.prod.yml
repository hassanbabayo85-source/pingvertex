# Production override for docker-compose.yml.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this changes vs. the base file:
#
#   1. POSTGRES_PASSWORD and GF_SECURITY_ADMIN_PASSWORD no longer fall back
#      to a dev default ("postgres" / "admin") — Compose refuses to start
#      if they aren't set in the environment/.env, instead of silently
#      booting with a credential every scanner tries first.
#
# The base file already binds postgres/prometheus/grafana/alertmanager to
# 127.0.0.1 only (not 0.0.0.0), so those ports are not reachable from the
# network in either dev or prod — this override does not need to touch
# `ports:` (Compose concatenates list-type fields like `ports` across
# files rather than replacing them, so a port published in the base file
# can't be un-published from an override anyway). If you need to reach
# Grafana/Prometheus/pgAdmin remotely in production, do it through an SSH
# tunnel or a VPN onto the host — never by publishing these ports wider.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production — no insecure default here}

  migrate:
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}@postgres:5432/uptime_monitor

  api:
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}@postgres:5432/uptime_monitor

  worker:
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set for production}@postgres:5432/uptime_monitor

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD must be set for production — no insecure default here}
