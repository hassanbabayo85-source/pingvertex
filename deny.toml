[advisories]
# The workspace's resolved graph currently contains Leptos 0.7.x.
# Its transitive `paste` and `proc-macro-error2` dependencies are reported
# as unmaintained by RustSec and have no direct patched release available.
# Current upstream Leptos also still references these crates, so this is
# tracked as an upstream maintenance warning rather than hidden as an
# unknown vulnerability. Keep the warning visible in cargo-deny output.
unmaintained = "workspace"

ignore = [
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
