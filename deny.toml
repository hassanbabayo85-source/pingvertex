[advisories]
ignore = [
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # RUSTSEC-2023-0071 (rsa 0.9.10, Marvin Attack timing side-channel):
    # rsa is pulled in transitively ONLY via sqlx-mysql, one of sqlx's four
    # optional database-driver sub-crates (mysql/postgres/sqlite/any).
    # This workspace enables ONLY the "postgres" feature of sqlx everywhere
    # (see crates/infra/Cargo.toml, crates/worker/Cargo.toml) — verified via
    # `cargo tree -p api|worker|infra|agent` (no rsa/rkyv/sqlx-mysql in the
    # resolved graph) and `cargo build --workspace -v` (no "Compiling rsa"
    # line ever appears). No fixed upgrade exists upstream. H17 audit,
    # 2026-08-29.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0235 (rkyv 0.7.46, archive validation OOB read):
    # rkyv is an optional serialization backend of rust_decimal, which this
    # workspace uses only with the "serde" feature (see crates/domain,
    # crates/application, crates/api, crates/infra Cargo.toml) — never with
    # rkyv. Same verification method as above: absent from resolved
    # dependency trees and never compiled. H17 audit, 2026-08-29.
    "RUSTSEC-2026-0235",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
