# Workspace-level Cargo configuration.
#
# `[env]` sets environment variables for every `cargo test` / `cargo run`
# invocation in this workspace. `DATABASE_URL` points at the Docker
# Postgres (port 5433) that integration tests expect — without this,
# `infra::test_support` falls back to `localhost:5432` (the system
# Postgres) and picks up whatever stale `_sqlx_migrations` checksum
# happens to be there.
#
# This is not secret: the password is the documented dev/test password
# from `.env.test`. Production deploys set `DATABASE_URL` from the
# orchestrator, which overrides this value.
[env]
DATABASE_URL = "postgres://postgres:pingvertex_test_pw@localhost:5433/uptime_monitor_test"
